apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cinder-smoke
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cinder-retain
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: cinder-smoke
spec:
  containers:
    - name: check
      image: registry.k8s.io/pause:3.10.1@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: cinder-smoke
