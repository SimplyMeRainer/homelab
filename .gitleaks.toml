title = "Homelab public-source secret scan"

[extend]
useDefault = true

# Public Kubernetes repository signing-key FILE CHECKSUM, not a credential.
# Only this verified public digest is exempted. No file or token rule is ignored.
[[allowlists]]
description = "Verified public Kubernetes v1.35 Release.key SHA256"
regexTarget = "secret"
regexes = ["^7627818cf7bae52f9008c93e8b1f961f53dea11d40891778de216fb1b43be54d$"]
