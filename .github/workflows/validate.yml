name: Validate development kit
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/runtime/collections
      ANSIBLE_CONFIG: ${{ github.workspace }}/runtime/ansible.cfg
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan committed source for secrets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner .
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: "v3.19.0"
      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p runtime/collections
          printf '[defaults]\nhost_key_checking = True\n' > runtime/ansible.cfg
          python -m pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apache2-utils
          ansible-galaxy collection install -r requirements-galaxy.yml -p runtime/collections
          docker compose version
      - name: Run offline tests and native checks
        run: make validate
  minio-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build checksum-pinned upstream MinIO source
        run: docker build --progress=plain -t homelab-minio:ci services/minio
      - name: Exercise the resulting binary without starting a server
        run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges homelab-minio:ci --version
