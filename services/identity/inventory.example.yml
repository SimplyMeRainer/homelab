all:
  children:
    ipaserver:
      hosts:
        identity.lab.example:
          ansible_host: 192.0.2.41
      vars:
        ansible_user: identity-operator
        ipaserver_domain: lab.example
        ipaserver_realm: LAB.EXAMPLE
