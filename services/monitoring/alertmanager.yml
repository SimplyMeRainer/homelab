global:
  resolve_timeout: 5m
route:
  receiver: local-status-only
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: local-status-only
# Alerts are visible in the authenticated UI. No external notifications until a
# reviewed receiver and its file-based credential inputs are configured.
