global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/rules.yml
alerting:
  alertmanagers:
    - scheme: https
      static_configs:
        - targets: [alertmanager:9093]
      tls_config:
        ca_file: /run/ca.crt
        server_name: alertmanager
      basic_auth:
        username: monitor
        password_file: /run/secrets/monitor_password
scrape_configs:
  - job_name: prometheus
    scheme: https
    static_configs:
      - targets: [prometheus:9090]
    tls_config:
      ca_file: /run/ca.crt
      server_name: prometheus
    basic_auth:
      username: monitor
      password_file: /run/secrets/monitor_password
